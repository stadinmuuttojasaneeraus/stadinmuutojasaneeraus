<html lang="en">
<head>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f5f5f5; }
        header { background-color: #1e3a5f; color: white; padding: 15px; text-align: center; }
        nav { background-color: #2c5282; padding: 10px; text-align: center; }
        nav a { color: white; margin: 10px; text-decoration: none; font-weight: bold; }
        .container { padding: 20px; background: white; margin: 20px; border-radius: 10px; }
        footer { text-align: center; padding: 15px; background: #1e3a5f; color: white; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #2c5282; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #1e3a5f; }
    </style>
</head>
<body>

<header>
    <img src="images/logo.jpg" width="120"><br>
    <h1>Company Name</h1>
</header>

<nav>
    <a href="index_en.html">Home</a>
    <a href="about_en.html">About</a>
    <a href="services_en.html">Services</a>
    <a href="contact_en.html">Contact</a>
</nav>

<div class="container">
    <h2>Contact</h2>
    <form action="https://formspree.io/f/your-id" method="POST">
        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Message:</label>
        <textarea name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
    </form>
</div>

<footer>

</footer>

</body>
