<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER MED FULLBREDDSLOGGA -->
  <header class="banner-header"></header>

  <!-- NAV / FLIKAR -->
  <nav class="top-tabs">
  <a href="index.html">Koti</a>
  <a href="about.html">Meistä</a>
  <a href="services.html">Palvelut</a>
  <a href="contact.html">Yhteystiedot</a>
</nav>

  <!-- MAIN CONTENT / KONTAKT -->
  <main class="main-content">
    <div class="contact-container">
      <!-- Google Maps -->
      <div class="map-box">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1994.123456!2d24.941000!3d60.169500!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x46920a0000000001%3A0x0000000000000000!2sHelsinki!5e0!3m2!1sfi!2s!4v1670000000000" 
          width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <!-- Kontaktformulär -->
      <div class="contact-form">
        <h2>Kontakta oss</h2>
        <form action="mailto:info@example.com" method="post" enctype="text/plain">
          <input type="text" name="name" placeholder="Ditt namn" required>
          <input type="email" name="email" placeholder="Din e-post" required>
          <input type="text" name="subject" placeholder="Ämne">
          <textarea name="message" placeholder="Meddelande" rows="5" required></textarea>
          <button type="submit">Skicka</button>
        </form>
      </div>

      <!-- Adress och telefon -->
      <div class="contact-info">
        <h2>Vår Kontaktinformation</h2>
        <p><strong>Adress:</strong> Exempelgatan 1, 00100 Helsingfors</p>
        <p><strong>Telefon:</strong> +358 40 123 4567</p>
        <p><strong>E-post:</strong> info@example.com</p>
      </div>
    </div>
  </main>

  <!-- FOOTER / SPRÅKVAL -->
  <footer>
    <p>&copy; 2026 Företagsnamn</p>
    <div class="language-switch">
      <a href="#">SV</a> | <a href="#">EN</a>
    </div>
  </footer>
</body>
</html>
