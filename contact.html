<!DOCTYPE html>
<html lang="fi">

    <style>
        body { font-family: Arial, sans-serif; margin:0; background:#eef2f7; color:#333; }
        a { text-decoration: none; color: inherit; }
        header { background:#1e3a5f; color:white; padding:20px; text-align:center; position:relative; }
        header img { width:120px; margin-bottom:10px; }
        .language-switch { position:absolute; top:20px; right:20px; }
        .language-switch a { color:white; margin-left:10px; font-weight:bold; }

        nav { background:#2c5282; display:flex; justify-content:center; flex-wrap:wrap; padding:10px; }

        .container { max-width:600px; margin:30px auto; padding:20px; background:white; border-radius:10px; box-shadow:0 4px 6px rgba(0,0,0,0.1); }
        input, textarea, button { width:100%; padding:10px; margin-top:5px; margin-bottom:15px; border-radius:5px; border:1px solid #ccc; }
        button { background-color:#2c5282; color:white; border:none; cursor:pointer; transition:0.3s; }
        button:hover { background-color:#1e3a5f; }
        footer { text-align:center; padding:20px; background:#1e3a5f; color:white; margin-top:30px; }
        @media(max-width:768px){ nav{flex-direction:column;} }
    </style>
</head>

        <input type="text" name="name" required>
