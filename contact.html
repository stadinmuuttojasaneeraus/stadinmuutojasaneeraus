<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yhteystiedot</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Flik-meny över innehållet */
    .top-tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 15px 0;
    }
    .top-tabs a {
      background-color: #004aad;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }
    .top-tabs a:hover {
      background-color: #002f75;
    }

    /* Huvudinnehåll */
    .main-content {
      max-width: 800px;
      margin: 0 auto;
      background-color: rgba(255,255,255,0.85);
      border-radius: 10px;
      padding: 20px;
    }

    /* Kontaktformulär, telefon, karta styling */
    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .contact-form input[type="submit"] {
      background-color: #004aad;
      color: white;
      border: none;
      cursor: pointer;
    }

    .contact-form input[type="submit"]:hover {
      background-color: #002f75;
    }
  </style>
</head>
<body>

<!-- HEADER-BANNER -->
<header class="banner-header">
  <img src="images/logo.png" alt="Logo" class="logo-banner">
</header>

<!-- Flikarna över innehållet -->
<div class="top-tabs">
  <a href="services.html">Palvelut</a>
  <a href="contact.html">Yhteystiedot</a>
  <a href="about.html">Tietoa</a>
  <a href="offers.html">Tarjoukset</a>
</div>

<!-- BODY -->
<main class="main-content">

  <h1>Yhteystiedot</h1>

  <!-- Kontaktformulär -->
  <div class="contact-form" style="margin-bottom:20px;">
    <h2>Ota yhteyttä</h2>
    <form action="mailto:info@yritys.fi" method="post" enctype="text/plain">
      <label for="name">Nimi:</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Sähköposti:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="message">Viesti:</label><br>
      <textarea id="message" name="message" rows="5" required></textarea><br><br>

      <input type="submit" value="Lähetä">
    </form>
  </div>

  <!-- Telefonnummer -->
  <div class="contact-info" style="margin-bottom:20px;">
    <h2>Puhelin</h2>
    <p>+358 40 123 4567</p>
  </div>

  <!-- Google Maps -->
  <div class="map" style="width:100%;height:300px;">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1983.123456!2d24.945!3d60.169!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x123456789abcdef!2sYritys!5e0!3m2!1sfi!2sfi!4v0000000000000" 
      width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
  </div>

</main>

<!-- FOOTER -->
<footer>
  <p>&copy; 2026 Yritys. Kaikki oikeudet pidätetään.</p>
  <div class="language-switch">
    <a href="#">SV</a> | <a href="#">EN</a>
  </div>
</footer>

</body>
</html>
