<!DOCTYPE html>
<html lang="fi">
<head>

  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="banner-header">
    <img src="images/logo.png" alt="Logo" class="logo-banner">
  </header>

  <nav class="top-tabs">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>

  <main class="main-content">

    </div>

    <p>Telefon: 012-3456789</p>
    <p>Adress: Exempelgatan 1, Helsingfors</p>

  <footer>
    <p>&copy; 2026 Företagsnamn</p>
    <div class="language-switch">
      <a href="#">SV</a> | <a href="#">EN</a>
    </div>
